name: Scheduler check

# Vercel Hobby cron is capped at 2 entries running once per day each — a cap,
# not a rate. That single Vercel slot is spent on the keepalive, which is the
# one job that must not depend on GitHub. Everything else is scheduled here.
#
# This workflow exists to answer one Stage 1 question end to end: can a GitHub
# Actions runner reach the deployment and authenticate? It hits a route that
# touches nothing, so a failure means "unreachable or unauthorised" and never
# "the database is down".
#
# Needs:
#   repository VARIABLE  APP_URL      the STABLE production domain, never a
#                                     per-deployment URL — those change on
#                                     every deploy and this silently no-ops
#   repository SECRET    CRON_SECRET  byte-identical to the Vercel variable
#
# If it returns 401 from Vercel rather than the app, Deployment Protection is
# on. It is on by default and it blocks every external scheduler and webhook.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reach the deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is not set — Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$APP_URL/api/cron/ping" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/body; echo
          # Fail loudly. A scheduler that exits 0 on a 401 is a scheduler that
          # has silently stopped working.
          [ "$code" = "200" ]
